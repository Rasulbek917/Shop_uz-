name: Savdoza Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/savdoza_client/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
concurrency:
  group: savdoza-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter SDK
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve and analyze
        working-directory: apps/savdoza_client
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-pub
      - name: Build installation APK
        working-directory: apps/savdoza_client
        run: flutter build apk --debug --no-pub --dart-define=API_URL=https://shop.aminboyevrasulbek.uz --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: savdoza-android-apk
          path: apps/savdoza_client/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - name: Publish APK and website download details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/savdoza_client/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/savdoza-android.apk"
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --target "$GITHUB_SHA" --title "Savdoza Android sinov versiyasi" --notes "Android uchun sinov APK. Backend orqali login va POS."
          gh release upload android-latest "$RUNNER_TEMP/savdoza-android.apk" --clobber
          APK_PATH="$RUNNER_TEMP/savdoza-android.apk" python3 - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          data = Path(os.environ['APK_PATH']).read_bytes()
          target = Path('public/releases/manifest.json')
          manifest = json.loads(target.read_text())
          manifest['android'] = {'url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/android-latest/savdoza-android.apk', 'version': '1.0.0+' + os.environ['GITHUB_RUN_NUMBER'], 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'channel': 'debug'}
          target.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/releases/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Android APK download metadata"
          git pull --rebase origin main
          git push origin HEAD:main
