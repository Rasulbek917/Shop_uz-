name: POS receipt checks
on:
  push:
    branches: [main]
    paths:
      - 'src/components/pos/ReceiptModal.tsx'
      - 'src/app/kassir/page.tsx'
      - 'tests/pos-receipt.mjs'
      - '.github/workflows/pos-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: savdoza_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci -d savdoza_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/savdoza_test
      JWT_SECRET: receipt-ci-only-secret-123456789012345
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/pos-receipt.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pos-receipt-failure
          path: /tmp/pos-receipt-check
