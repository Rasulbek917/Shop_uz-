name: Offline sync database tests
on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/sales/**'
      - 'src/app/api/debts/**'
      - 'src/app/api/platform/requests/**'
      - 'src/app/api/shops/**'
      - 'src/lib/onboarding.ts'
      - 'src/lib/sale-replay.ts'
      - 'prisma/**'
      - 'tests/offline-database.cjs'
      - 'tests/backup-restore.cjs'
      - 'scripts/backup.mjs'
      - 'scripts/restore.mjs'
      - 'scripts/postgres-tools.mjs'
      - '.github/workflows/offline-sync-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: savdoza_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci -d savdoza_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/savdoza_test
      JWT_SECRET: offline-database-ci-only-secret-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update vulnerable dependencies
        if: github.actor != 'github-actions[bot]'
        run: |
          if node -e 'process.exit(require("./package.json").dependencies.next.includes("14.") ? 0 : 1)'; then
            npm install --package-lock-only --ignore-scripts next@15 'react@^19.2.0' 'react-dom@^19.2.0' zod@4.6.7 'postcss@^8.5.23' '@types/react@^19' '@types/react-dom@^19'
            npm audit fix --package-lock-only --ignore-scripts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'fix: update vulnerable production dependencies'
            git push origin HEAD:main
          fi
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: node tests/checkout-flow.cjs
      - run: node tests/tezcheck-security.cjs
      - run: node tests/offline-database.cjs
      - run: node tests/backup-restore.cjs
